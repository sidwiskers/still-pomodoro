name: Float visual review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"
      - name: Build signed release
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Render Float
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            adb shell wm size 1200x1920
            adb shell wm density 240
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell appops set app.still.pomodoro SYSTEM_ALERT_WINDOW allow
            adb shell am start -W -n app.still.pomodoro/app.still.pomodoro.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null && adb pull /sdcard/ui.xml ui.xml >/dev/null && python3 -c 'import xml.etree.ElementTree as E,re; r=E.parse("ui.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Float"); a=list(map(int,re.findall(r"\d+",n.attrib["bounds"]))); print((a[0]+a[2])//2,(a[1]+a[3])//2)' > coords.txt && adb shell input tap $(cat coords.txt)
            sleep 2
            adb exec-out screencap -p > float-collapsed.png
            adb shell input tap 1083 176
            sleep 1
            adb exec-out screencap -p > float-expanded.png
            test -s float-collapsed.png
            test -s float-expanded.png
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: float-visual-review
          path: |
            float-collapsed.png
            float-expanded.png
          if-no-files-found: ignore
