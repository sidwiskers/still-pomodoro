name: Publish v1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/release-v1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"

      - name: Build signed release
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Still-1.0.1.apk
          gh release create v1.0.1 app/build/outputs/apk/release/Still-1.0.1.apk \
            --target "$GITHUB_SHA" \
            --title "Still v1.0.1" \
            --notes "Fixes the startup crash on Android 11 and newer caused by configuring WindowInsetsController before the window DecorView existed. Signed release validated by runtime launch tests across Android API 26, 29, 30, 35, and 36."
