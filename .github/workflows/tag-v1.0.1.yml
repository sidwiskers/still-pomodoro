name: Tag v1.0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.head_commit.message == 'chore: tag v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create release tag
        run: |
          git tag v1.0.1 "$GITHUB_SHA"
          git push origin v1.0.1
