name: Cute meow candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Fetch cute meow preview
        run: |
          curl -L --fail --retry 3 \
            'https://cdn.freesound.org/previews/448/448084_9159316-hq.mp3' \
            -o cute-meow-hq.mp3
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 cute-meow-hq.mp3
      - name: Prepare Still preview
        run: |
          ffmpeg -hide_banner -y -i cute-meow-hq.mp3 \
            -af "highpass=f=90,lowpass=f=15000,loudnorm=I=-17:TP=-1.5:LRA=7,afade=t=in:st=0:d=0.008,afade=t=out:st=0.56:d=0.035" \
            -ac 1 -ar 32000 -c:a libvorbis -q:a 5 still-cute-meow.ogg
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 still-cute-meow.ogg
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: still-cute-meow
          path: still-cute-meow.ogg
          if-no-files-found: error
