name: Cute meow candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Freesound page
        run: |
          curl -L --fail --retry 3 \
            'https://freesound.org/people/Breviceps/sounds/448084/' \
            -o sound.html
          python3 - <<'PY'
          import re, html
          s=open('sound.html', encoding='utf-8', errors='ignore').read()
          s=html.unescape(s).replace('\\u002F','/').replace('\\/','/')
          urls=[]
          for p in [r'https://cdn\.freesound\.org[^"\'<> ]+', r'https://freesound\.org/data/previews/[^"\'<> ]+', r'/data/previews/[^"\'<> ]+']:
              urls += re.findall(p,s)
          urls=list(dict.fromkeys(urls))
          print('\n'.join(urls))
          open('preview-urls.txt','w').write('\n'.join(urls))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: cute-meow-probe
          path: |
            sound.html
            preview-urls.txt
          if-no-files-found: error
