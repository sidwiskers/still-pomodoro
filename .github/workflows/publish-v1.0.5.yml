name: Publish v1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/release-v1.0.5'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release version
        shell: bash
        run: |
          grep -q "versionCode 6" app/build.gradle
          grep -q "versionName '1.0.5'" app/build.gradle
          if gh release view v1.0.5 >/dev/null 2>&1; then
            echo 'v1.0.5 already exists' >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"

      - name: Build signed release
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify signing lineage
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signature.txt | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          EXPECTED='7E62DD1AEFF8EBA4F0AF7D7434D6FDA2FD0FDDD122D05FD7774FEC4C7926ACCC'
          test "$ACTUAL" = "$EXPECTED"

      - name: Name and hash APK
        shell: bash
        run: |
          mv app/build/outputs/apk/release/app-release.apk Still-1.0.5.apk
          sha256sum Still-1.0.5.apk | tee Still-1.0.5.sha256

      - name: Upload exact APK
        uses: actions/upload-artifact@v4
        with:
          name: Still-1.0.5
          path: |
            Still-1.0.5.apk
            Still-1.0.5.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 Still-1.0.5.apk Still-1.0.5.sha256 \
            --target "$GITHUB_SHA" \
            --title 'Still v1.0.5' \
            --notes 'Adds local focus-time history and a full-cycle Start over action. Focus time is tracked from timer timestamps without per-second storage writes; the home screen shows Today and a 7-day history view. Start over returns to Focus · Session 1 while preserving recorded focus time.'
