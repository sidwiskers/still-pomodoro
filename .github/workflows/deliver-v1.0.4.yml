name: Deliver Still v1.0.4

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Download published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download v1.0.4 --repo "$GITHUB_REPOSITORY" --pattern 'Still-1.0.4.apk' --dir out
          test -s out/Still-1.0.4.apk
          sha256sum out/Still-1.0.4.apk
      - name: Upload exact release APK
        uses: actions/upload-artifact@v4
        with:
          name: Still-1.0.4-release-asset
          path: out/Still-1.0.4.apk
          if-no-files-found: error
