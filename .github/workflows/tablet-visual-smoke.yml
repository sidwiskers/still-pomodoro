name: Tablet visual smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tablet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"

      - name: Build signed release APK
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Render tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n app.still.pomodoro/app.still.pomodoro.MainActivity | tee tablet-start.txt
            grep -q 'Status: ok' tablet-start.txt
            sleep 3
            adb exec-out screencap -p > still-tablet.png
            test -s still-tablet.png

      - name: Upload tablet render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: still-tablet-render
          path: |
            still-tablet.png
            tablet-start.txt
          if-no-files-found: ignore
