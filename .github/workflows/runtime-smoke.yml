name: Runtime smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 30, 35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"

      - name: Build signed release APK
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"

      - name: Launch and detect runtime crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c || true
            adb shell am force-stop app.still.pomodoro
            adb shell am start -W -n app.still.pomodoro/app.still.pomodoro.MainActivity | tee start-output.txt
            grep -q 'Status: ok' start-output.txt
            sleep 5
            adb logcat -d > runtime-logcat.txt || true
            ! grep -qE 'FATAL EXCEPTION|Process: app\.still\.pomodoro' runtime-logcat.txt
            adb shell dumpsys activity activities > activity-state.txt
            grep -q 'app.still.pomodoro/.MainActivity' activity-state.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnostics-api-${{ matrix.api }}
          path: |
            start-output.txt
            runtime-logcat.txt
            activity-state.txt
          if-no-files-found: ignore
