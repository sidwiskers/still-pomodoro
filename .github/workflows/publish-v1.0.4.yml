name: Publish Still v1.0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/release-v1.0.4'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"
      - name: Build signed release
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk Still-1.0.4.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Still-1.0.4
          path: Still-1.0.4.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4 Still-1.0.4.apk \
            --target "$GITHUB_SHA" \
            --title "Still v1.0.4" \
            --notes "Fixes the active timer notification progress bar so it advances with the countdown. The native countdown chronometer remains system-driven, while the progress snapshot is refreshed quietly during active sessions. Includes all v1.0.3 UI and Float improvements. Signed release APK built and verified by GitHub Actions."
