name: Notification progress review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/still-release.jks"
          chmod 600 "$RUNNER_TEMP/still-release.jks"
      - name: Build signed release
        env:
          STILL_STORE_FILE: ${{ runner.temp }}/still-release.jks
          STILL_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Exercise live notification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant app.still.pomodoro android.permission.POST_NOTIFICATIONS || true
            adb logcat -c || true
            adb shell am start -W -n app.still.pomodoro/app.still.pomodoro.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null
            adb pull /sdcard/ui.xml ui-before.xml >/dev/null
            python3 -c 'import xml.etree.ElementTree as E,re; r=E.parse("ui-before.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Start"); a=list(map(int,re.findall(r"\d+",n.attrib["bounds"]))); print((a[0]+a[2])//2,(a[1]+a[3])//2)' > coords.txt
            adb shell input tap $(cat coords.txt)
            sleep 3
            adb shell uiautomator dump /sdcard/ui-after.xml >/dev/null
            adb pull /sdcard/ui-after.xml ui-after.xml >/dev/null
            grep -q 'text="Pause"' ui-after.xml
            adb shell dumpsys notification --noredact > notification-before.txt
            adb shell dumpsys activity services > services-before.txt
            sleep 12
            adb shell dumpsys notification --noredact > notification-after.txt
            adb shell dumpsys activity services > services-after.txt
            adb logcat -d > logcat.txt || true
            grep -q 'TimerNotificationService' services-after.txt
            python3 -c 'import re; f=lambda p:int(re.search(r"android\.progress=Integer \(([0-9]+)\)",open(p,encoding="utf-8",errors="ignore").read()).group(1)); b=f("notification-before.txt"); a=f("notification-after.txt"); print("notification progress:",b,"->",a); assert a>b, "notification progress did not advance"'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-progress-review
          path: |
            notification-before.txt
            notification-after.txt
            services-before.txt
            services-after.txt
            logcat.txt
            ui-before.xml
            ui-after.xml
          if-no-files-found: ignore
