name: Focus history review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Exercise focus ledger and UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear app.still.pomodoro >/dev/null
            adb shell pm grant app.still.pomodoro android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n app.still.pomodoro/app.still.pomodoro.MainActivity >/dev/null
            sleep 2

            click_text() {
              local needle="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml window.xml >/dev/null
              python3 - "$needle" <<'PY'
            import re,sys,subprocess
            needle=sys.argv[1]
            xml=open('window.xml',encoding='utf-8').read()
            hits=re.findall(r'<node[^>]*text="([^"]*)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',xml)
            for text,x1,y1,x2,y2 in hits:
                if text == needle or needle in text:
                    x=(int(x1)+int(x2))//2; y=(int(y1)+int(y2))//2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    sys.exit(0)
            raise SystemExit('text not found: '+needle)
            PY
            }

            click_text "Start"
            sleep 4
            adb exec-out run-as app.still.pomodoro cat shared_prefs/still_timer.xml > running.xml
            ! grep -q 'focus_day_' running.xml

            click_text "Pause"
            sleep 1
            adb exec-out run-as app.still.pomodoro cat shared_prefs/still_timer.xml > paused.xml
            DAY_VALUE=$(python3 - <<'PY'
            import re
            s=open('paused.xml').read()
            m=re.search(r'<long name="focus_day_[^"]+" value="(\d+)"',s)
            if not m: raise SystemExit('focus day value missing')
            print(m.group(1))
            PY
            )
            test "$DAY_VALUE" -ge 2500
            test "$DAY_VALUE" -le 10000

            click_text "Start"
            sleep 3
            click_text "Reset"
            sleep 1
            adb exec-out run-as app.still.pomodoro cat shared_prefs/still_timer.xml > reset.xml
            RESET_VALUE=$(python3 - <<'PY'
            import re
            s=open('reset.xml').read()
            m=re.search(r'<long name="focus_day_[^"]+" value="(\d+)"',s)
            if not m: raise SystemExit('focus day value missing after reset')
            print(m.group(1))
            PY
            )
            test "$RESET_VALUE" -gt "$DAY_VALUE"

            click_text "TODAY"
            sleep 1
            adb shell uiautomator dump /sdcard/history.xml >/dev/null
            adb pull /sdcard/history.xml history.xml >/dev/null
            grep -q 'Focus history' history.xml
            grep -q '7 DAYS' history.xml
            grep -q 'DAILY AVG' history.xml
            click_text "Close"

            click_text "Timing"
            sleep 1
            click_text "Start over"
            sleep 1
            adb shell uiautomator dump /sdcard/reset-confirm.xml >/dev/null
            adb pull /sdcard/reset-confirm.xml reset-confirm.xml >/dev/null
            grep -q 'Start over this cycle?' reset-confirm.xml
            grep -q "Today's focus time stays recorded." reset-confirm.xml

            adb exec-out screencap -p > focus-home.png

      - name: Upload review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-history-review
          path: |
            running.xml
            paused.xml
            reset.xml
            history.xml
            reset-confirm.xml
            focus-home.png
          if-no-files-found: ignore
